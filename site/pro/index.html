<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turismo Club — Espace équipe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 50'%3E%3Cpath d='M4 48V22a20 20 0 0 1 40 0v26z' fill='%239F1239'/%3E%3Cpath d='M14 48V24a10 10 0 0 1 20 0v24z' fill='%23fff'/%3E%3Cpath d='M17 48a7 7 0 0 1 14 0z' fill='%239F1239'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F3; --card:#FFFFFF; --line:#E7E1DC; --radius:14px;
  --accent:#9F1239; --accent-dark:#881337; --accent-soft:#FFF1F2;
  --ink:#111827; --ink-2:#4B5563; --muted:#6B7280;
  --ok:#047857; --ok-soft:#ECFDF5; --wait:#B45309; --wait-dot:#D97706; --wait-soft:#FFFBEB; --info:#2563EB; --info-soft:#EFF6FF;
  --late:#B91C1C;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)} a:hover{color:var(--accent-dark)}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
h1,h2,h3{line-height:1.2;letter-spacing:-.3px;margin:0}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.board,.qcard,.tscroll,.card{position:relative}
[hidden]{display:none!important}

/* Mise en page : menu à gauche, contenu à droite */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px;text-decoration:none}
.brand svg{height:38px;width:auto;display:block}
.brand .tag{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--accent-soft);color:var(--accent-dark)}
.nav a[aria-current="page"]{background:var(--accent);color:#fff}
.count{min-width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav a[aria-current="page"] .count{background:#fff;color:var(--accent)}
.who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px}
.who strong{display:block}
.who span{font-size:13px;color:var(--ink-2)}
main{flex:1;min-width:0;padding:28px 32px 48px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-head h1{font-size:26px;font-weight:800}
.sub{color:var(--ink-2);margin:4px 0 0}

/* Éléments */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent-dark)}
.btn.quiet{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.quiet:hover{background:var(--bg);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px;padding:0 4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:700;font-size:13px;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{border:1px solid #CFC7C0;border-radius:10px;padding:10px 12px;min-height:44px;background:#fff;width:100%}
.field textarea{min-height:96px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:14px}
.row > *{flex:1 1 180px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-in_progress{background:var(--wait-soft);color:var(--wait)}
.st-sent{background:var(--info-soft);color:var(--info)}
.st-won{background:var(--ok-soft);color:var(--ok)}
.st-done{background:#F3F4F6;color:#374151}
.st-lost{background:#F3F4F6;color:#6B7280;text-decoration:line-through}
.src{background:#F3F4F6;color:#374151}
.err{color:var(--late);font-size:13px}
.alert{border-radius:10px;padding:12px 14px;font-size:14px}
.alert.bad{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.alert.good{background:var(--ok-soft);color:var(--ok);border:1px solid #A7F3D0}
.empty{border:1px dashed #CFC7C0;border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-2);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tfoot td{font-weight:800;border-bottom:none}
.num{text-align:right;white-space:nowrap}

/* Tableau des demandes */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(250px,1fr));gap:14px;align-items:start}
.col{background:#EFEAE6;border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h2{font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.age{color:var(--ink-2);font-weight:600}
.age.late{color:var(--late);font-weight:800}
.qcard a.name{font-weight:800;font-size:16px;text-decoration:none;color:var(--ink)}
.qcard a.name:hover{color:var(--accent)}
.qcard .meta{font-size:13px;color:var(--ink-2)}
.qcard select{min-height:40px;border:1px solid #CFC7C0;border-radius:8px;padding:0 8px;background:#fff;font-size:14px}

/* Fiche */
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px;align-items:start}
.grid2 > *,.stack > *{min-width:0}
/* Lot 1 : clients, glisser-déposer, motif d'annulation, icônes */
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.duprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qcard[draggable="true"]{cursor:grab}.qcard.dragging{opacity:.5}
.col.over{outline:3px dashed var(--accent);outline-offset:-3px}
dialog.dlg{border:none;border-radius:var(--radius);padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.dlg::backdrop{background:rgba(17,24,39,.45)}
.dlgform{display:flex;flex-direction:column;gap:12px;padding:20px}.dlgform h2{font-size:18px;font-weight:800}
.ico{flex:none;vertical-align:middle}
.ichip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#F4F1EE;font-size:13px;margin:0 6px 6px 0}
.ipicker{border:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.ipick{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.ipick:has(input:checked){border-color:var(--accent);background:#FFF1F3}.ipick input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:2px 6px;min-height:28px}
h3{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.sec h2{font-size:16px;font-weight:800;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.bar{height:10px;border-radius:999px;background:#F1ECE8;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.timeline small{display:block;color:var(--ink-2);font-size:12.5px}
.recap{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin:0}

/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi strong{font-size:30px;font-weight:800;line-height:1.1}
.kpi strong.muted{color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.todo li:last-child{border-bottom:none}
.todo a{text-decoration:none;color:var(--ink);min-height:24px}
.todo a:hover{color:var(--accent)}
.todo .late{color:var(--late);font-weight:700}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:90px 1fr 32px;gap:10px;align-items:center;font-size:14px}
.bars .track{height:10px;background:#F1ECE8;border-radius:999px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent)}
.bars strong{text-align:right}
.langsw{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px;font-size:13px}

/* E-mails */
.mailgrid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.maillist{flex:1 1 300px;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.mailread{flex:999 1 460px;min-width:0}
.mrow{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);padding:12px 14px;background:#fff;cursor:pointer;min-height:44px}
.mrow:hover{background:var(--bg)}
.mrow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mtop{display:flex;justify-content:space-between;gap:8px}
.mfrom{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.unread .mfrom,.mrow.unread .msubj{font-weight:800}
.mwhen{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.msubj{font-size:14px}
.mprev{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mailbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.autof{border-color:#6EE7B7!important;background:#ECFDF5!important}
.autotag{color:var(--ok);font-weight:700}

/* Planning */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--ink-2);margin:0 0 12px}
.legend .sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);vertical-align:middle}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;align-items:start;overflow-x:auto;padding-bottom:6px;position:relative}
.day{background:#EFEAE6;border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.day.is-today{outline:2px solid var(--accent)}
.day h2{font-size:13px;font-weight:800;text-transform:capitalize;padding:2px 4px}
.dep{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;font-size:12.5px;min-height:44px;color:var(--ink)}
.dep:hover{border-color:var(--accent)}
.dep .dt{font-size:13px;line-height:1.25}
.dep .df{color:var(--ink-2)}
.dep .okc{color:var(--ok);font-weight:800}
.dep.closed{opacity:.55;text-decoration:line-through}
.t-activity{background:#FFE4E6}.t-circuit{background:#DBEAFE}.t-other{background:#FEF3C7}
.alert-mini{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:700;width:max-content}
.dlg{border:1px solid var(--line);border-radius:14px;max-width:640px;width:calc(100% - 24px);padding:20px;max-height:92vh}
.dlg::backdrop{background:rgba(17,24,39,.45)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.late{color:var(--late);font-weight:700}

/* Vue guide (téléphone) */
.vg{min-height:100vh;padding-bottom:84px}
.vghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vghead svg{height:30px;width:auto}
.vgmain{max-width:640px;margin:0 auto;padding:16px}
.vgcard{margin-bottom:14px;display:flex;flex-direction:column}
.vgday{font-size:14px;font-weight:800;text-transform:capitalize;margin:16px 0 8px}
.arrived{margin:12px 0 8px;font-size:20px;font-weight:800;color:var(--ok)}
.pcheck{display:flex;align-items:center;gap:12px}
.chk{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:2px solid #CFC7C0;background:#fff;font-size:22px;font-weight:800;color:#fff;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.notes{margin-top:12px;background:var(--wait-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.notes ul{margin:4px 0 0;padding-left:18px}
.avail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.avail li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-transform:capitalize}
.seg{display:flex;gap:4px}
.seg button{min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.vgtabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.vgtabs a{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;color:var(--ink-2)}
.vgtabs a[aria-current="page"]{color:#fff;background:var(--accent)}

/* Connexion */
.login{max-width:440px;margin:10vh auto;padding:0 16px}
.login .card{padding:28px;display:flex;flex-direction:column;gap:16px}

@media (max-width:900px){
  .shell{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{flex-direction:row;align-items:center;gap:10px}
  .brand svg{height:30px}
  .nav{flex-direction:row;flex-wrap:wrap;order:3;width:100%}
  .who{margin:0 0 0 auto;border:none;padding:0;flex-direction:row;align-items:center}
  .who .info{display:none}
  main{padding:18px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .board{overflow-x:auto;grid-template-columns:repeat(var(--cols,4),minmax(250px,82vw));padding-bottom:6px}
}
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:24px">JavaScript est nécessaire pour l'espace équipe.</p></noscript>

<script src="views/dossier.js"></script>
<script src="views/icons.js"></script>
<script src="views/clients.js"></script>
<script src="views/fournisseurs.js"></script>
<script src="views/hotels.js"></script>
<script src="views/emailparse.js"></script>
<script src="views/emails.js"></script>
<script src="views/nouvelle.js"></script>
<script src="views/bientot.js"></script>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-type="service" data-radius="soft">
<head>

<meta property="og:title" content="Turismo Club — Rome">
<meta property="og:description" content="Local travel agency in Rome: guided tours, bus tours, day trips across Italy, hotels and restaurants. Send a booking request in 10 languages and get a reply within 24 h.">
<meta property="og:url" content="https://turismoclub.it/">

<style>
:root{
  /* Direction (taste-skill, tirage) : service · palette white-signal-red · Host Grotesk · radius soft · héros film · moment pinned-chapters · footer-dark · close-photo · dark-band · boutons solid · marque arc */
  --accent:#9F1239; --accent-dark:#881337; --accent-light:#FFE4E6; --hero:#0A0A0A; --ink:#0A0A0A; --ink-2:#333333; --muted:#666666;
  --line:#E4E4E4; --soft:#F2F2F2; --bg:#FFFFFF; --cream:#F2F2F2; --cream-line:#E4E4E4;
  --radius:16px; --r-btn:10px; --shadow:0 1px 2px rgba(10,10,10,.06),0 10px 28px -12px rgba(10,10,10,.22);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Host Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
a{color:var(--accent)}a:hover{color:var(--accent-dark)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.demo{background:#1E3A8A;color:#EFF6FF;font-size:13px;text-align:center;padding:8px 16px}
header.site{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;text-decoration:none;color:var(--ink);min-height:44px}
.logo span{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
nav.main{display:flex;flex-wrap:wrap;gap:22px;font-weight:600;font-size:15px}
nav.main a{color:var(--ink-2);text-decoration:none;padding:6px 0}
nav.main a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-dark);color:#fff}
.btn[disabled]{background:#9CA3AF;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.dark,.btn.is-on{background:var(--ink)}
.cart-btn{position:relative;border:1px solid #D1D5DB;background:#fff;color:var(--ink);min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.cart-btn b{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
h1,h2,h3{letter-spacing:-.4px;line-height:1.15}
.section{padding-top:72px}
.section h2{font-size:30px;font-weight:800;margin:0}
.row-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:24px}
.eyebrow{margin:0;color:var(--accent);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.ph{display:flex;align-items:flex-end;padding:12px;color:#1F2937}
.ph small{background:rgba(255,255,255,.9);border-radius:6px;padding:3px 8px;font-size:12px}
/* hero */
.hero{margin:24px auto 0;border-radius:24px;background:var(--hero);min-height:540px;padding:64px 48px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;max-width:1192px}
.hero .scene{position:absolute;inset:0;pointer-events:none}
.hero .scene svg{width:100%;height:100%;display:block}
.hero > *:not(.scene){position:relative}
.illo{position:absolute;inset:0}.illo svg{width:100%;height:100%;display:block}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .hero-photo{position:absolute;inset:0}
.hero .hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,22,.82) 0%,rgba(10,14,22,.55) 55%,rgba(10,14,22,.25) 100%)}
.flagbar{display:none;height:5px}
html[data-pal^="tricolore"] .flagbar{display:flex}
.flagbar i{flex:1}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto}
.pbadge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;width:max-content}
.pbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 16px}
.pnav{display:flex;flex-wrap:wrap;gap:8px;padding-top:16px}
.pnav button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.pnav button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.langsel{position:relative}
#langBtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:30}
.langmenu[hidden]{display:none}
.langmenu button{min-height:40px;text-align:left;border:none;background:none;padding:0 12px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink)}
.langmenu button:hover{background:var(--soft)}
.langmenu button[aria-current="true"]{font-weight:800;background:var(--cream)}
.ph1{font-size:30px;margin:0 0 16px}.ph2{font-size:20px;margin:0 0 12px}
.card .img{overflow:hidden}
.card .badge{z-index:1}
.tile{position:relative;overflow:hidden}
.tile .illo{opacity:.9}
.tile .lbl{position:relative;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;font-size:15px;line-height:1.25}
.logo svg{height:40px;width:auto;display:block}
.palette-fab{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.palette-fab > *{pointer-events:auto}
.palette-panel[hidden]{display:none}
.palette-fab > button{min-height:48px;padding:0 16px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:8px}
.palette-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;width:250px}
.pal{display:flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;cursor:pointer;font-weight:600;text-align:left}
.pal[aria-pressed="true"]{border:2px solid var(--ink)}
.sw{display:flex}.sw i{width:18px;height:18px;border-radius:999px;margin-right:-5px;border:2px solid #fff;display:block}
.brand-grid{display:flex;flex-wrap:wrap;gap:20px}
.brand-card{flex:1 1 320px;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.brand-card .light{padding:28px;display:flex;align-items:center;justify-content:center;min-height:120px}
.brand-card .dark{padding:28px;display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--hero)}
.brand-card .light svg,.brand-card .dark svg{height:52px;width:auto}
.brand-card .foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:auto}
.swatches{display:flex;height:84px}.swatches div{flex:1;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700}
.hero h1{margin:0;color:#fff;font-weight:800;font-size:clamp(34px,5vw,60px);max-width:780px}
.hero p{margin:0;color:#E5E7EB;font-size:18px;max-width:600px}
.search{background:#fff;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;max-width:960px}
.search .f{flex:1 1 180px;display:flex;flex-direction:column;gap:2px;padding:6px 12px}
.search .f + .f{border-left:1px solid var(--line)}
.search label{font-size:12px;font-weight:700;color:var(--muted)}
.search select,.search input{border:none;font-size:16px;padding:6px 0;background:#fff;min-height:32px}
.stats{display:flex;flex-wrap:wrap;gap:16px;padding-top:16px}
.stat{flex:1 1 220px;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat strong{display:block;font-size:28px;font-weight:800}
.stat span{font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.tile{height:150px;border-radius:var(--radius);color:var(--ink);text-decoration:none;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700;border:none;cursor:pointer;text-align:left;font-size:16px}
.tile span{font-weight:500;font-size:13px}
.cards{display:flex;flex-wrap:wrap;gap:22px}
.card{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:18px;overflow:hidden;padding-bottom:18px;background:#fff;transition:box-shadow .15s}
.card:hover{box-shadow:0 10px 28px rgba(17,24,39,.10);color:var(--ink)}
.card .img{height:190px;position:relative}
.card .badge{position:absolute;left:12px;top:12px;background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.card .body{padding:6px 18px 0;display:flex;flex-direction:column;gap:6px}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.card strong.t{font-size:17px;line-height:1.35}
.price{font-size:16px}
.price span{color:var(--muted)}
.split{display:flex;flex-wrap:wrap;gap:48px;align-items:center}
.split > *{flex:1 1 420px;min-width:0}
.cta{background:var(--cream);border:1px solid var(--cream-line);border-radius:24px;padding:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
details{border:1px solid var(--line);border-radius:14px;padding:16px 20px}
details + details{margin-top:12px}
summary{cursor:pointer;font-weight:700;font-size:17px}
footer.site{border-top:1px solid var(--line);margin-top:80px}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;padding-top:36px;padding-bottom:36px;font-size:14px;color:var(--muted)}
/* catalogue */
.crumb{font-size:14px;color:var(--muted);padding-top:28px}
.crumb a{color:var(--muted)}
.layout{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding-top:28px}
.filters{flex:1 1 250px;border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:24px}
.filters fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.filters legend{font-weight:800;margin-bottom:8px}
.filters label{display:flex;gap:10px;align-items:center;min-height:34px;font-size:15px;cursor:pointer}
.filters input[type=checkbox],.filters input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.filters select{border:1px solid #D1D5DB;border-radius:10px;padding:10px;min-height:44px;background:#fff}
.results{flex:999 1 560px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.toolbar select{border:1px solid #D1D5DB;border-radius:10px;padding:8px 12px;min-height:44px;background:#fff}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;padding:0;min-height:44px;cursor:pointer;text-align:left}
.empty{border:1px dashed #D1D5DB;border-radius:var(--radius);padding:40px;text-align:center;color:var(--muted)}
/* fiche */
.gallery{display:flex;flex-wrap:wrap;gap:12px;padding-top:20px}
.gallery .big{flex:2 1 520px;height:420px;border-radius:18px}
.gallery .side{flex:1 1 260px;display:flex;flex-direction:column;gap:12px}
.gallery .side div{flex:1 1 190px;border-radius:18px}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:36px}
.content h2{font-size:23px;font-weight:800;margin:0 0 12px}
.content ul{margin:0;padding-left:20px;line-height:1.8}
.steps{list-style:none;margin:0 0 0 8px;padding:0;border-left:2px solid var(--cream-line)}
.steps li{padding:0 0 18px 20px}
.steps li span{display:block;color:var(--muted);font-size:15px}
.incl{display:flex;flex-wrap:wrap;gap:20px}
.incl > div{flex:1 1 240px;border-radius:var(--radius);padding:20px}
.map{height:220px;border-radius:var(--radius);background:#E5E7EB;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink-2)}
.book{flex:1 1 340px;min-width:0;position:sticky;top:96px;border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(17,24,39,.08);background:#fff}
.book h3{margin:0;font-size:14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;min-height:56px;min-width:64px;padding:6px 10px;border-radius:12px;border:1px solid #D1D5DB;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.2}
.chip b{font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.slot small{font-weight:500;font-size:11px;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot[aria-pressed="true"] small{color:#E5E7EB}
.slot[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.counter{display:flex;justify-content:space-between;align-items:center}
.counter .ctl{display:flex;align-items:center;gap:12px}
.counter button{width:44px;height:44px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;font-size:20px;cursor:pointer}
.counter button[disabled]{opacity:.4;cursor:not-allowed}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:17px}
.warn{background:#FEF2F2;color:#991B1B;border-radius:10px;padding:10px 12px;font-size:14px}
.ok{background:#F0FDF4;color:#166534;border-radius:10px;padding:10px 12px;font-size:14px}
/* panier / formulaires */
.panel{border:1px solid var(--line);border-radius:20px;padding:24px}
.line-item{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line-item .thumb{width:96px;height:72px;border-radius:12px;flex:0 0 auto}
.line-item .info{flex:1 1 240px}
.form{display:flex;flex-direction:column;gap:16px}
.form .row{display:flex;flex-wrap:wrap;gap:16px}
.form .row > *{flex:1 1 220px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{border:1px solid #D1D5DB;border-radius:10px;padding:12px;font-size:16px;min-height:48px;background:#fff}
.field textarea{min-height:110px;resize:vertical}
.field .err{color:#B91C1C;font-size:13px;min-height:0}
.field input[aria-invalid="true"]{border-color:#B91C1C}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.sim{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;border-radius:12px;padding:14px 16px;font-size:14px}
.success{text-align:center;max-width:640px;margin:0 auto;padding:72px 24px 0;display:flex;flex-direction:column;gap:16px;align-items:center}
.success .ref{font-size:28px;font-weight:800;letter-spacing:2px;background:var(--soft);border-radius:12px;padding:12px 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legal h2{font-size:20px;margin:18px 0 4px}.legal p{margin:0 0 8px}.legal ul{margin:0 0 8px;padding-left:20px;line-height:1.7}
@media (max-width:640px){
  .hero{padding:40px 22px;margin:16px}
  .hero .scene{opacity:.3}
  .search .f + .f{border-left:none;border-top:1px solid var(--line)}
  .book{position:static}
  header.site{position:static}
  .topbar{display:none}
  nav.main{order:3;width:100%}
  nav.main{gap:14px;font-size:14px}
  .langmenu{left:0;right:auto}
}

/* ===== Direction artistique (branche essais-style) ===== */
::selection{background:var(--accent-light);color:var(--ink)}
html{scrollbar-color:#C8C8C8 transparent}
body{font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
a{text-underline-offset:3px}
h1,h2,h3{font-weight:400;letter-spacing:-.035em;text-wrap:balance;line-height:1.04}
strong,b{font-weight:600}
.wrap{max-width:1280px;padding:0 40px}
.demo{background:var(--soft);color:var(--ink-2);border-bottom:1px solid var(--line)}
/* en-tête */
header.site{border-bottom:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
header.site .wrap{padding-top:12px;padding-bottom:12px}
nav.main{gap:4px;font-weight:500;font-size:16px}
nav.main a{padding:10px 14px;color:var(--ink);background-image:linear-gradient(var(--ink),var(--ink));background-size:0 1.5px;background-repeat:no-repeat;background-position:14px calc(100% - 8px);transition:background-size .35s var(--ease)}
nav.main a:hover{color:var(--ink);background-size:calc(100% - 28px) 1.5px}
nav.main a[aria-current="page"]{color:var(--ink);box-shadow:none;background-size:calc(100% - 28px) 1.5px}
.cart-btn,#langBtn{border-radius:var(--r-btn);border-color:var(--line);font-weight:500}
/* boutons pleins : marche au survol, pression au clic */
.btn{border-radius:var(--r-btn);font-weight:500;padding:0 24px;min-height:52px;transition:background .2s,transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(159,18,57,.7)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:none}
.btn.ghost{border:1.5px solid var(--ink);background:transparent}
.btn.ghost:hover{background:var(--ink);color:#fff;box-shadow:none}
/* rythme */
.section{padding-top:128px}
.section h2,.row-head h2{font-size:clamp(34px,4.2vw,56px)}
.row-head{margin-bottom:40px;align-items:flex-end}
.row-head p{font-size:18px;max-width:52ch}
.row-head a{color:var(--ink);text-decoration:none;font-weight:500;background-image:linear-gradient(var(--ink),var(--ink));background-size:100% 1.5px;background-repeat:no-repeat;background-position:0 100%;padding-bottom:2px;transition:background-size .35s var(--ease)}
.row-head a:hover{background-size:0 1.5px;background-position:100% 100%}
/* héros « film » : un cadre photo sur les lignes du conteneur, les mots dans un bloc plein */
.hero{width:min(1200px,calc(100% - 80px));max-width:none;margin:12px auto 16px;height:calc(100svh - var(--hdr,84px) - 28px);min-height:560px;max-height:980px;border-radius:24px;padding:0;display:block;background:#0A0A0A}
.hero .scene{display:none}
.hero .hero-photo::after{display:none}
.hero .hero-photo img{transform-origin:60% 40%}
.hero > .hero-box{position:absolute}
.hero-box{position:absolute;left:32px;bottom:32px;width:min(640px,calc(100% - 64px));max-height:calc(100% - 64px);background:#0A0A0A;color:#fff;border-radius:18px;padding:40px;display:flex;flex-direction:column;gap:18px}
.hero h1{margin:0;color:#fff;font-weight:400;font-size:clamp(38px,4.2vw,60px);line-height:1.03;letter-spacing:-.04em}
.hero p{margin:0;color:#D6D6D6;font-size:18px;max-width:42ch}
.hero .search{display:grid;grid-template-columns:1fr 1fr auto;gap:0;background:#fff;border-radius:12px;padding:6px;max-width:none;margin-top:6px;box-shadow:none;align-items:stretch}
.search .f{padding:8px 14px;gap:0}
.search .f + .f{border-left:1px solid var(--line)}
.search label{font-size:12px;font-weight:500;color:var(--muted)}
.search select,.search input{color:var(--ink);font-weight:500;cursor:pointer;padding:2px 0}
.search .btn{min-height:52px;height:52px;align-self:center}
[data-enter] .hero-box{animation:enterBox .9s var(--ease) .15s both}
[data-enter] .hero-photo img{animation:enterPhoto 1.6s var(--ease) both}
@keyframes enterBox{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes enterPhoto{from{transform:scale(1.06)}to{transform:none}}
/* cartes : la carte monte de 2 px, la photo zoome dans son cadre */
.cards{gap:40px 28px}
.card{border:none;border-radius:0;padding-bottom:4px;gap:12px;background:transparent;transition:transform .35s var(--ease)}
.card:hover{box-shadow:none;transform:translateY(-2px)}
.card .img{height:auto;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden}
.card .img img,.card .img .photo{transition:transform .7s var(--ease)}
.card:hover .img img{transform:scale(1.03)}
.card .badge{border-radius:8px;padding:5px 10px;font-weight:500;background:#fff}
.card .body{padding:0}
.meta{font-weight:400}
.card strong.t{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.price{font-size:16px}
.price strong{font-weight:600}
/* catégories en mosaïque */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:260px;gap:16px}
.tiles .tile:first-child,.tiles .tile:last-child{grid-column:span 2}
.tile{height:auto;border-radius:var(--radius);padding:20px;transition:transform .35s var(--ease)}
.tile .illo,.tile .photo{transition:transform .7s var(--ease)}
.tile:hover{transform:translateY(-2px)}
.tile:hover .photo{transform:scale(1.03)}
.tile .lbl{background:#fff;border-radius:10px;padding:10px 14px;font-weight:500;font-size:17px;box-shadow:none}
.tile .lbl span{color:var(--muted);font-weight:400}
.tiles .tile:first-child .lbl{font-size:24px;padding:14px 18px;letter-spacing:-.02em}
/* bande noire (pourquoi nous) */
.section.split{background:#0A0A0A;color:#fff;border-radius:24px;padding:72px;margin-top:128px;gap:64px}
.section.split h2{color:#fff;font-size:clamp(34px,4vw,52px)!important}
.section.split p{color:#BDBDBD!important}
.section.split strong{color:#fff!important}
.section.split > div:first-child{height:480px!important;border-radius:16px!important}
/* « comment ça marche » (moment pinned-chapters) */
.how{padding-top:128px}
.how-grid{display:grid;gap:56px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.how h2{font-size:clamp(34px,4.2vw,56px);margin:0 0 40px}
.how-steps{list-style:none;margin:0;padding:0;display:grid;gap:28px}
.how-step{display:grid;gap:8px;padding-left:24px;border-left:2px solid var(--line);transition:border-color .3s}
.how-step h3{font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.2;transition:color .3s}
.how-step h3 span{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:10px}
.how-step p{margin:0;color:var(--ink-2);max-width:46ch}
.how-step .how-pic{display:none}
.how-frame{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--soft)}
.how-frame .how-pic{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity .5s ease,transform .9s var(--ease)}
.how-frame .how-pic.on{opacity:1;transform:none}
.how.live{height:200svh;padding-top:0}
.how.live .how-grid{position:sticky;top:0;height:100svh;padding-top:88px;box-sizing:border-box}
.how.live .how-step h3{color:#707070}
.how.live .how-step p{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s cubic-bezier(.2,.7,.2,1),opacity .3s}
.how.live .how-step p > span{min-height:0;overflow:hidden}
.how.live .how-step.on{border-left-color:var(--accent)}
.how.live .how-step.on h3{color:var(--ink)}
.how.live .how-step.on p{grid-template-rows:1fr;opacity:1}
/* fermeture sur photo (voyage sur mesure) */
.cta{position:relative;overflow:hidden;background:#0A0A0A;border:none;border-radius:24px;padding:0;min-height:560px;display:flex;align-items:flex-end}
.cta .cta-photo{position:absolute;inset:0}
.cta .cta-box{position:relative;margin:32px;background:#fff;color:var(--ink);border-radius:18px;padding:40px;max-width:560px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.cta .cta-box h2{font-size:clamp(30px,3.4vw,44px)!important}
details{border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
details + details{margin-top:0}
summary{font-weight:500;font-size:20px;letter-spacing:-.01em;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;line-height:1;color:var(--muted);transition:transform .3s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--ink-2);max-width:68ch}
/* pied de page noir */
footer.site{background:#0A0A0A;color:#BDBDBD;border-top:none;margin-top:128px}
footer.site .wrap{padding-top:56px;padding-bottom:56px;color:#BDBDBD}
footer.site strong{color:#fff!important}
footer.site a{color:#E6E6E6!important}
/* fiches, formulaires */
.filters,.panel{border-radius:var(--radius)}
.filters input[type=checkbox],.filters input[type=radio],.check input{accent-color:var(--accent)}
.field input,.field select,.field textarea,.filters select,.toolbar select{border-radius:10px;border-color:#D0D0D0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(10,10,10,.08)}
.book{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow)}
.chip,.slot{border-radius:10px}
.chip[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.gallery .big,.gallery .side div{border-radius:var(--radius)}
.palette-fab{display:none}
@media (max-width:1023px){
  .how-grid{grid-template-columns:1fr}
  .how-frame{display:none}
  .how-step .how-pic{display:block;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-top:12px}
  .tiles{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}
  .section.split{padding:40px}
}

}

   Clé PUBLIQUE : faite pour être dans le navigateur. Les droits (RLS) limitent

const SUPA = { url: 'https://dkocjkpcfneyevxexrsr.supabase.co', key: 'sb_publishable_LduCL-R41JyZCNodRv4S_A_WCHCdKCX' };
function supa(path, opts) {
  opts = opts || {};
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 8000);
  return fetch(SUPA.url + '/rest/v1/' + path, Object.assign({}, opts, { signal: ctrl.signal, headers: Object.assign({ apikey: SUPA.key, 'Content-Type': 'application/json' }, opts.headers || {}) }))
    .finally(() => clearTimeout(tm));
}
async function syncFromDb() {
  try {
    const r = await supa('site_offers?select=slug,price_adult_cents,price_child_cents');
    if (!r.ok) return;
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) return;
    ACTIVITIES.forEach(a => {
      const row = rows.find(x => x.slug === a.slug);
      if (row) { a.adult = row.price_adult_cents / 100; a.child = row.price_child_cents != null ? row.price_child_cents / 100 : a.adult; a.published = true; }
      else a.published = false;
    });
    state.dbOk = true;
    if (!state.typing) rerender(); // ne pas effacer un formulaire en cours de saisie
  } catch (e) {}
}
async function sendRequestToDb(payload) {
  try {
    const r = await supa('quote_requests', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(Object.assign({ language: LANG, source: 'site' }, payload)) });
    return r.ok;
  } catch (e) { return false; }
}

const eurFmt = {};
function eur(n) { const loc = LOCALE(), dec = Math.round(n * 100) % 100 ? 2 : 0, k = loc + dec; return (eurFmt[k] = eurFmt[k] || new Intl.NumberFormat(loc, { style: 'currency', currency: 'EUR', minimumFractionDigits: dec, maximumFractionDigits: dec })).format(n); } // centimes affichés seulement si le prix en a (19,90 €)
function longDate(isoStr) { return new Date(isoStr + 'T12:00:00').toLocaleDateString(LOCALE(), { weekday: 'short', day: 'numeric', month: 'short' }); }
function durTxt(a) {
  const m = a.minutes; if (!m) return '';
  if (m === 1440) return '24 h';
  if (m > 1440) return Math.round(m / 1440) + ' ' + tr('days');
  if (m >= 600) return tr('fullday');
  return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) : '');
}
function priceTxt(a) {
  if (a.onRequest) return `<strong>${tr('on_req')}</strong>`;

/* ===================== Disponibilités réelles (fonction offer_availability, migration 31) ===================== */
const ROME_DAY = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit' });
const ROME_TIME = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const FEW_SEATS = 5;
const hasCalendar = a => ['activity', 'bus', 'circuit'].includes(a.type);
async function loadAvail(a) {
  const st = state.avail[a.slug];
  if (st && (st.days || st.loading)) return;
  state.avail[a.slug] = { loading: true };
  try {
    const r = await supa('rpc/offer_availability', { method: 'POST', body: JSON.stringify({ p_slug: a.slug, p_days: 60 }) });
    const rows = r.ok ? await r.json() : [];
    const days = {};
    (Array.isArray(rows) ? rows : []).forEach(x => { const d = new Date(x.starts_at); const k = ROME_DAY.format(d); (days[k] = days[k] || []).push({ t: ROME_TIME.format(d), n: x.seats_left }); });
    const keys = Object.keys(days).sort();
    state.avail[a.slug] = { days: keys.length ? days : null, month: keys.length ? keys[0].slice(0, 7) : null };
  } catch (e) { state.avail[a.slug] = { days: null }; }
  const box = $('#avail'); if (box && box.dataset.slug === a.slug) { box.outerHTML = calendarHtml(a); syncTimes(a); }
}
function calendarHtml(a) {
  const st = state.avail[a.slug] || {}, p = state.pick[a.slug] || {};
  if (st.loading) return `<div id="avail" data-slug="${a.slug}" class="avail"><p class="avail-wait">${tr('cal_loading')}</p></div>`;
  if (!st.days) return `<div id="avail" data-slug="${a.slug}" hidden></div>`;
  const keys = Object.keys(st.days).sort(), first = keys[0].slice(0, 7), last = keys[keys.length - 1].slice(0, 7);
  const [y, m] = st.month.split('-').map(Number);
  const start = new Date(Date.UTC(y, m - 1, 1)), nDays = new Date(Date.UTC(y, m, 0)).getUTCDate(), lead = (start.getUTCDay() + 6) % 7;
  const wk = Array.from({ length: 7 }, (_, i) => new Date(Date.UTC(2024, 0, 1 + i)).toLocaleDateString(LOCALE(), { weekday: 'narrow', timeZone: 'UTC' }));
  const title = start.toLocaleDateString(LOCALE(), { month: 'long', year: 'numeric', timeZone: 'UTC' });
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= nDays; d++) {
    const k = st.month + '-' + String(d).padStart(2, '0'), slots = st.days[k];
    if (!slots) { cells += `<span class="cd off">${d}</span>`; continue; }
    const free = slots.reduce((s, x) => s + x.n, 0), maxOne = Math.max(...slots.map(x => x.n));
    const lab = free === 0 ? tr('cal_full') : maxOne <= FEW_SEATS ? tr('cal_left', { n: maxOne }) : '';
    const full = new Date(k + 'T12:00:00').toLocaleDateString(LOCALE(), { weekday: 'long', day: 'numeric', month: 'long' });
    cells += `<button type="button" class="cd${free === 0 ? ' full' : maxOne <= FEW_SEATS ? ' few' : ''}" data-day="${k}" aria-pressed="${p.day === k}" aria-label="${esc(full + (lab ? ' · ' + lab : ''))}" ${free === 0 ? 'disabled' : ''}>${d}<small>${lab || '&nbsp;'}</small></button>`;
  }
  const sel = p.day && st.days[p.day];
  return `<div id="avail" data-slug="${a.slug}" class="avail">
    <div class="avail-head"><h3>${tr('cal_t')}</h3><div class="avail-nav">
      <button type="button" data-calm="-1" aria-label="${tr('cal_prev')}" ${st.month <= first ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" data-calm="1" aria-label="${tr('cal_next')}" ${st.month >= last ? 'disabled' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div></div>
    <p class="avail-month" aria-live="polite">${esc(title)}</p>
    <span class="err" id="erq-cal" role="alert"></span>
    <div class="avail-grid">${wk.map(w => `<span class="wd" aria-hidden="true">${esc(w)}</span>`).join('')}${cells}</div>
    ${sel ? `<p class="avail-sub">${tr('cal_times')}</p><div class="avail-times">${sel.map(x => `<button type="button" class="at${x.n <= FEW_SEATS ? ' few' : ''}" data-time="${x.t}" aria-pressed="${p.time === x.t}" ${x.n === 0 ? 'disabled' : ''}>${x.t}<small>${x.n === 0 ? tr('cal_full') : tr('cal_seats', { n: x.n })}</small></button>`).join('')}</div>` : ''}
    ${sel && p.time ? (() => { const x = sel.find(s => s.t === p.time); return x && x.n > 0 && x.n <= FEW_SEATS ? `<p class="avail-few">${tr('cal_few', { n: x.n })}</p>` : ''; })() : ''}
  </div>`;
}

function syncTimes(a) {

}

// Récapitulatif + boutons de contact direct (affichés après l'envoi, ou à la place si la base ne répond pas)
function resultBox(r) {
  const msg = tr('wa_msg', { offer: r.offer, date: r.date || '—', n: r.pax, name: r.name });
  const body = msg + (r.extra ? '\n\n' + r.extra : '');
  const wa = CONFIG.whatsappLink ? `<a class="btn${r.ok ? ' ghost' : ''}" id="waBtn" href="${esc(waLink(msg))}" target="_blank" rel="noopener">${tr(r.ok ? 'br_wa' : 'br_wa2')}</a>` : '';
  const mail = CONFIG.email ? `<a class="btn ghost" id="mailBtn" href="${esc(mailLink(tr('br_t') + ' — ' + r.offer, body))}">${tr('br_mail')}</a>` : '';
  return `<div class="form" style="gap:12px">
    <p class="${r.ok ? 'ok' : 'warn'}" role="${r.ok ? 'status' : 'alert'}" tabindex="-1" id="reqResult" style="margin:0">${tr(r.ok ? 'br_ok' : 'br_fail')}</p>
    <p style="margin:0;font-size:14px;color:var(--ink-2);white-space:pre-line">${esc(msg)}</p>
    ${wa}${mail}
    <button type="button" class="linkbtn" data-req-again>${tr('br_new')}</button></div>`;
}
async function sendRequest(target, payload, recap) {
  // target : objet d'état qui reçoit le résultat (state.pick[slug] ou state.quote)
  const ok = await sendRequestToDb(payload);
  target.result = Object.assign({ ok }, recap);
  rerender();
  const r = $('#reqResult'); if (r) r.focus();
}

function submitBooking(f) {
  const a = bySlug[f.dataset.slug]; const p = state.pick[a.slug];
  const nm = $('#rq-name'), em = $('#rq-email'), dt = $('#rq-date'), px = $('#rq-pax'), ok1 = $('#rq-ok');
  const pax = Math.round(Number(px.value));
  let ok = setErr(nm, $('#erq-name'), nm.value.trim() ? '' : tr('e_name'));
  ok = setErr(em, $('#erq-email'), validEmail(em.value.trim()) ? '' : tr('e_email')) && ok;
  ok = setErr(dt, $('#erq-date'), dt.value && dt.value >= today1() ? '' : tr('e_date')) && ok;
  ok = setErr(px, $('#erq-pax'), pax >= 1 && pax <= 99 ? '' : tr('e_pax')) && ok;
  ok = setErr(ok1, $('#erq-ok'), ok1.checked ? '' : tr('e_consent')) && ok;
  const calOn = $('.book .avail-grid'), ec = $('#erq-cal'); if (ec) ec.textContent = calOn ? $('#erq-date').textContent : '';
  if (!ok) { const bad = f.querySelector('[aria-invalid="true"]'); if (bad === dt && calOn) (document.querySelector('#avail button.cd:not(:disabled)') || dt).focus(); else bad.focus(); return; }
  if ($('#rq-web').value) { p.result = { ok: true, offer: L(a.title), date: dt.value, pax, name: nm.value.trim() }; rerender(); return; } // robot : on ne fait rien
  if (Date.now() - p.t0 < MIN_FILL_MS) { $('#erq-form').textContent = tr('e_wait'); return; }
  $('#erq-form').textContent = '';
  const tm = $('#rq-time'), nights = $('#rq-nights');
  const n = nights ? Math.max(1, Math.round(Number(nights.value) || 1)) : 0;
  const extra = [tm ? tr('time') + ': ' + tm.value : '', n ? tr('nights') + ': ' + n : '', $('#rq-msg').value.trim()].filter(Boolean).join('\n');
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = tr('br_sending');
  sendRequest(p, {
    first_name: nm.value.trim().slice(0, 200), email: em.value.trim().slice(0, 200), phone: $('#rq-phone').value.trim().slice(0, 50) || null,
    date_from: dt.value, date_to: n ? iso(new Date(new Date(dt.value + 'T12:00:00').getTime() + n * 864e5)) : null,
    travelers: pax, interests: [a.type], offer_slug: a.slug, preferred_language: $('#rq-lang').value, consent_at: new Date().toISOString(),
    message: [`${a.type} · ${a.slug} · ${a.title.en}`, tm ? 'time ' + tm.value : '', n ? n + ' night(s)' : '', $('#rq-msg').value.trim()].filter(Boolean).join(' · ').slice(0, 2000)
  }, { offer: L(a.title), date: dt.value + (tm ? ' ' + tm.value : ''), pax, name: nm.value.trim(), extra });
}

function submitQuote(f) {
  const q = state.quote;
  const prenom = $('#q-prenom'), email = $('#q-email'), du = $('#q-du'), au = $('#q-au'), ok1 = $('#q-ok');
  let ok = setErr(prenom, $('#eq-prenom'), prenom.value.trim() ? '' : tr('e_name'));
  ok = setErr(email, $('#eq-email'), validEmail(email.value.trim()) ? '' : tr('e_email')) && ok;
  ok = setErr(au, $('#eq-au'), du.value && au.value && au.value < du.value ? tr('e_dates') : '') && ok;
  ok = setErr(ok1, $('#eq-ok'), ok1.checked ? '' : tr('e_consent')) && ok;
  if (!ok) { f.querySelector('[aria-invalid="true"]').focus(); return; }
  const pax = Math.min(99, Math.max(1, Math.round(Number($('#q-nb').value) || 1)));
  const dates = (du.value || '?') + ' → ' + (au.value || '?');
  const recap = { offer: tr('cta_eb'), date: dates, pax, name: prenom.value.trim(), extra: [`${tr('budget')}: ${$('#q-budget').value}`, $('#q-msg').value.trim()].filter(Boolean).join('\n') };
  if ($('#q-web').value) { q.result = Object.assign({ ok: true }, recap); rerender(); return; }
  if (Date.now() - q.t0 < MIN_FILL_MS) { $('#eq-form').textContent = tr('e_wait'); return; }
  $('#eq-form').textContent = '';
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = tr('br_sending');
  sendRequest(q, {
    first_name: prenom.value.trim().slice(0, 200), email: email.value.trim().slice(0, 200), phone: $('#q-tel').value.trim().slice(0, 50) || null,
    date_from: du.value || null, date_to: au.value || null, travelers: pax, preferred_language: $('#q-lang').value, consent_at: new Date().toISOString(),
    interests: [...document.querySelectorAll('input[name=q-envie]:checked')].map(x => x.value), offer_slug: 'sur-mesure',
    message: `[Budget ${$('#q-budget').value}] ${$('#q-msg').value.trim()}`.slice(0, 2000)
  }, recap);
}

function cfgLines(lg) {
  const c = CONFIG, L2 = lg === 'it'
    ? { co: 'Ragione sociale', vat: 'Partita IVA', rea: 'Numero REA', addr: 'Sede', mail: 'E-mail', wa: 'WhatsApp' }
    : { co: 'Company name', vat: 'VAT number (P.IVA)', rea: 'REA number', addr: 'Address', mail: 'Email', wa: 'WhatsApp' };
  return [[L2.co, esc(c.company)], [L2.vat, esc(c.vat)], [L2.rea, esc(c.rea)], [L2.addr, esc(c.address)],
    [L2.mail, c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''],
    [L2.wa, c.whatsapp ? `<a href="${esc(c.whatsappLink)}" rel="noopener">${esc(c.whatsapp)}</a>` : '']]
    .filter(r => r[1]).map(r => `<li><strong>${r[0]}:</strong> ${r[1]}</li>`).join('');
}

  return `<div class="wrap legal" style="max-width:860px" lang="${lg}">

}

    <div id="langMenu" class="langmenu" hidden>${LANGS.map(l => `<button type="button" data-lang="${l.c}" lang="${l.c}" aria-current="${l.c === LANG}">${l.n}</button>`).join('')}</div></div>`;
  const ft = $('footer.site .wrap');
  const ml = c => `<a href="${c[0]}" style="color:var(--muted)">${c[1]}</a>`;
  if (ft) ft.innerHTML = `<span><strong style="color:var(--ink)">${esc(CONFIG.company)}</strong>${CONFIG.address ? ' · ' + esc(CONFIG.address) : ''}${CONFIG.vat ? ' · P.IVA ' + esc(CONFIG.vat) : ''}${CONFIG.email ? ' · ' + ml(['mailto:' + esc(CONFIG.email), esc(CONFIG.email)]) : ''}${CONFIG.whatsapp ? ' · ' + ml([esc(CONFIG.whatsappLink), 'WhatsApp ' + esc(CONFIG.whatsapp)]) : ''}</span>`
    + `<span>${[['#privacy', tr('privacy')], ['#legal', tr('legal')], ['#credits', tr('credits')]].map(ml).join(' · ')}</span>`;
}
function setLang(c) {
  if (!UI[c]) return;
  LANG = c; try { localStorage.setItem('tc-lang', c); } catch (e) {} // seul stockage local : la langue
  applyChrome(); rerender();
}


/* ===================== Recherche d'hôtels (prix calculés par la base : TTC, jamais de coût ni de marge) ===================== */
function hotelResultsHtml(r) {
  if (r.loading) return `<p role="status">${tr('ht_loading')}</p>`;
  if (r.error) return `<p class="warn" role="alert">${tr('ht_err')}</p>`;
  if (!r.list) return '';
  if (!r.list.length) return `<p class="warn" role="status">${tr('ht_none')} <a href="#devis">${tr('nav_custom')}</a></p>`;
  return r.list.map(h => `<article class="panel" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
    ${h.photos && h.photos[0] ? `<img src="${esc(h.photos[0])}" alt="${esc(h.name)}" loading="lazy" referrerpolicy="no-referrer" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px" onerror="this.remove()">` : ''}
    <h2 style="margin:0;font-size:20px">${esc(h.name)} ${h.stars ? `<span aria-label="${h.stars} ★">${'★'.repeat(h.stars)}</span>` : ''}</h2>
    ${h.address ? `<p style="margin:0;color:var(--ink-2)">${esc(h.address)}</p>` : ''}
    ${h.description && (h.description[LANG] || h.description.en || h.description.it || h.description.fr) ? `<p style="margin:0">${esc(h.description[LANG] || h.description.en || h.description.it || h.description.fr)}</p>` : ''}
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">${h.options.map((o, i) => `<li style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px">
      <span><strong>${esc(o.room)}</strong> · ${tr('board_' + o.board)}<br><span style="color:var(--ink-2);font-size:14px">${tr('ht_total', { n: o.nights })} : <strong style="color:var(--ink)">${eur(o.total_cents / 100)}</strong></span></span>
      <button type="button" class="btn" data-ht-pick="${h.id}:${i}">${tr('ht_pick')}</button></li>`).join('')}</ul></article>`).join('');
}
function pageHotels() {
  const s = state.hotels || (state.hotels = { dest: '', din: today1(), dout: iso(new Date(new Date(today1() + 'T12:00:00').getTime() + 2 * 864e5)), adults: 2, ages: [], res: {}, pick: null });
  const destOpts = Object.keys(DESTINATIONS).map(k => `<option value="${k}" ${k === s.dest ? 'selected' : ''}>${esc(L(DESTINATIONS[k]))}</option>`).join('');
  if (s.pick) {
    const p = s.pick, q = s.req || (s.req = { t0: Date.now() });
    if (q.result) return `<div class="wrap" style="max-width:720px"><div class="success" style="align-items:stretch;text-align:left">${resultBox(q.result)}</div></div>`;
    return `<div class="wrap" style="max-width:720px">
      <p><button type="button" class="linkbtn" data-ht-back>${tr('ht_back')}</button></p>
      <h1 style="font-size:clamp(24px,3.5vw,34px);margin:6px 0">${tr('ht_form')}</h1>
      <p style="margin:0 0 16px"><strong>${esc(p.hotel)}</strong> · ${esc(p.room)} · ${tr('board_' + p.board)}<br>${esc(s.din)} → ${esc(s.dout)} · ${tr('ht_adults')} ${s.adults}${s.ages.length ? ' · ' + tr('ht_kids') + ' ' + s.ages.join(', ') : ''}<br>${tr('ht_total', { n: p.nights })} : <strong>${eur(p.total_cents / 100)}</strong></p>
      <p style="margin:0 0 16px;color:var(--ink-2);font-size:14px">${tr('ht_ondemand')}</p>
      <form class="panel form" id="htReq" novalidate style="position:relative">
        <div class="field"><label for="hq-name">${tr('f_name')}</label><input id="hq-name" autocomplete="name" required aria-describedby="ehq-name"><span class="err" id="ehq-name"></span></div>
        <div class="field"><label for="hq-email">${tr('email')}</label><input id="hq-email" type="email" autocomplete="email" required aria-describedby="ehq-email"><span class="err" id="ehq-email"></span></div>
        <div class="field"><label for="hq-phone">${tr('phone')}</label><input id="hq-phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="hq-lang">${tr('f_lang')}</label><select id="hq-lang">${langOptions(LANG)}</select></div>
        <div class="field"><label for="hq-msg">${tr('f_msg')}</label><textarea id="hq-msg" maxlength="1500"></textarea></div>
        ${honeypot('hq-web')}${consentField('hq-ok')}
        <span class="err" id="ehq-form" role="alert"></span>
        <button type="submit" class="btn">${tr('br_send')}</button></form></div>`;
  }
  return `<div class="wrap" style="max-width:960px">
    <nav class="crumb" aria-label="Breadcrumb"><a href="#accueil">${tr('home')}</a> › ${tr('nav_hotels')}</nav>
    <h1 style="font-size:clamp(28px,4vw,40px);margin:10px 0 6px">${tr('ht_t')}</h1>
    <p style="margin:0 0 20px;color:var(--ink-2)">${tr('ht_d')}</p>
    <form class="panel form" id="htSearch" novalidate>
      <div class="row">
        <div class="field"><label for="ht-dest">${tr('ht_dest')}</label><select id="ht-dest"><option value="">${tr('ht_any')}</option>${destOpts}</select></div>
        <div class="field"><label for="ht-in">${tr('ht_in')}</label><input id="ht-in" type="date" min="${today1()}" value="${esc(s.din)}" required></div>
        <div class="field"><label for="ht-out">${tr('ht_out')}</label><input id="ht-out" type="date" min="${today1()}" value="${esc(s.dout)}" required></div>
      </div>
      <div class="row">
        <div class="field"><label for="ht-ad">${tr('ht_adults')}</label><select id="ht-ad">${[1, 2, 3, 4, 5, 6].map(n => `<option ${n === s.adults ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label for="ht-kids">${tr('ht_kids')}</label><select id="ht-kids">${[0, 1, 2, 3, 4].map(n => `<option ${n === s.ages.length ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        ${s.ages.map((a, i) => `<div class="field"><label for="ht-age-${i}">${tr('ht_age', { n: i + 1 })}</label><select id="ht-age-${i}" data-ht-age="${i}">${Array.from({ length: 18 }, (_, k) => `<option ${k === a ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`).join('')}
      </div>
      <button type="submit" class="btn">${tr('ht_search')}</button>
    </form>
    <div id="htResults" aria-live="polite" style="margin-top:20px">${hotelResultsHtml(s.res)}</div></div>`;
}
async function searchHotels() {
  const s = state.hotels;
  if (!s.din || !s.dout || s.dout <= s.din || (new Date(s.dout) - new Date(s.din)) / 864e5 > 30 || s.din < today1()) { s.res = { error: true }; rerender(); return; }
  s.res = { loading: true }; rerender();
  try {
    const r = await supa('rpc/public_hotel_search', { method: 'POST', body: JSON.stringify({ p_dest: s.dest || null, p_in: s.din, p_out: s.dout, p_adults: s.adults, p_child_ages: s.ages }) });
    s.res = { list: r.ok ? await r.json() : [] };
  } catch (e) { s.res = { list: [] }; }
  rerender();
}
function submitHotelRequest(f) {
  const s = state.hotels, p = s.pick, q = s.req;
  const nm = $('#hq-name'), em = $('#hq-email'), ok1 = $('#hq-ok');
  let ok = setErr(nm, $('#ehq-name'), nm.value.trim() ? '' : tr('e_name'));
  ok = setErr(em, $('#ehq-email'), validEmail(em.value.trim()) ? '' : tr('e_email')) && ok;
  ok = setErr(ok1, $('#ehq-ok'), ok1.checked ? '' : tr('e_consent')) && ok;
  if (!ok) { f.querySelector('[aria-invalid="true"]').focus(); return; }
  const offer = `${p.hotel} · ${p.room} · ${tr('board_' + p.board)}`, pax = s.adults + s.ages.length;
  if ($('#hq-web').value) { q.result = { ok: true, offer, date: s.din, pax, name: nm.value.trim() }; rerender(); return; }
  if (Date.now() - q.t0 < MIN_FILL_MS) { $('#ehq-form').textContent = tr('e_wait'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = tr('br_sending');
  const extra = [`${s.din} → ${s.dout}`, `${eur(p.total_cents / 100)}`, s.ages.length ? 'ages ' + s.ages.join(', ') : '', $('#hq-msg').value.trim()].filter(Boolean).join('\n');
  sendRequest(q, {
    first_name: nm.value.trim().slice(0, 200), email: em.value.trim().slice(0, 200), phone: $('#hq-phone').value.trim().slice(0, 50) || null,
    date_from: s.din, date_to: s.dout, travelers: pax, interests: ['hotel'], offer_slug: 'hotel-search', preferred_language: $('#hq-lang').value, consent_at: new Date().toISOString(),
    hotel: `${p.hotel} — ${p.room} — ${p.board}`.slice(0, 200),
    message: [`hotel search · ${p.hotel} · ${p.room} · ${p.board} · ${s.din}→${s.dout} · ${s.adults} adult(s)${s.ages.length ? ' · children ' + s.ages.join(',') : ''} · total ${(p.total_cents / 100).toFixed(2)} EUR TTC (prix affiché au client)`, $('#hq-msg').value.trim()].filter(Boolean).join(' · ').slice(0, 2000)
  }, { offer, date: s.din, pax, name: nm.value.trim(), extra });
}

/* ===================== Routeur (#accueil, #catalogue, #activite-xxx…) ===================== */
function render() {
  const h = (location.hash || '#accueil').slice(1);
  const app = $('#app');
  let html, nav = '';
  if (h === 'panier' || h === 'confirmation') { location.replace('#catalogue'); return; }
  if (h === 'catalogue') { html = pageCatalogue(); nav = 'catalogue'; }
  else if (h.startsWith('activite-') && bySlug[h.slice(9)]) { html = pageFiche(bySlug[h.slice(9)]); nav = 'catalogue'; }
  else if (h === 'devis') { html = pageDevis(); nav = 'devis'; }
  else if (h === 'hotels') { html = pageHotels(); nav = 'hotels'; }
  else if (h === 'credits') { html = pageCredits(); }
  else if (h === 'privacy') { html = pagePrivacy(); }
  else if (h === 'legal') { html = pageLegal(); }
  else { html = pageAccueil(); nav = h === 'accueil-faq' ? 'faq' : ''; }
  app.innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  updateCartCount();
  if (h === 'accueil-faq') { const f = $('#faq'); if (f) f.scrollIntoView(); }
  else if (!render.keepScroll) window.scrollTo(0, 0);
  render.keepScroll = false;
  initHow(); setHdr();
  if (h.startsWith('activite-') && bySlug[h.slice(9)]) { const a = bySlug[h.slice(9)]; noteRecent(a.slug); if (hasCalendar(a) && !(state.pick[a.slug] || {}).result) { loadAvail(a); syncTimes(a); } }
  document.title = 'Turismo Club — ' + ({ catalogue: tr('nav_offers'), devis: tr('nav_custom'), hotels: tr('nav_hotels'), credits: tr('credits'), privacy: tr('privacy'), legal: tr('legal') }[h] || (h.startsWith('activite-') && bySlug[h.slice(9)] ? L(bySlug[h.slice(9)].title) : tr('hero_eb')));
}

/* ===================== Moment « pinned-chapters » (taste-skill) : seulement sur grand écran, sans « réduire les animations » ===================== */
let howOff = null;
function initHow() {
  if (howOff) { howOff(); howOff = null; }
  const root = $('#how'); if (!root) return;
  const steps = [...root.querySelectorAll('.how-step')], pics = [...root.querySelectorAll('.how-frame .how-pic')];
  const fits = () => matchMedia('(min-width: 1024px)').matches && innerHeight >= 640 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = -1;
  const show = i => { if (i === k) return; k = i; steps.forEach((x, n) => x.classList.toggle('on', n === i)); pics.forEach((x, n) => x.classList.toggle('on', n === i)); };
  const tick = () => {
    if (!root.classList.contains('live')) return;
    const r = root.getBoundingClientRect(), span = r.height - innerHeight;
    const prog = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
    show(Math.min(steps.length - 1, Math.floor(prog * steps.length)));
  };
  const sync = () => { const on = fits(); root.classList.toggle('live', on); if (on) { k = -1; tick(); if (k < 0) show(0); } else { steps.forEach(x => x.classList.remove('on')); show(0); } };
  sync();
  const onR = () => sync();
  addEventListener('scroll', tick, { passive: true }); addEventListener('resize', onR);
  howOff = () => { removeEventListener('scroll', tick); removeEventListener('resize', onR); };
}
function setHdr() { const h = document.querySelector('header.site'); if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px'); }
addEventListener('resize', setHdr);
function rerender() { render.keepScroll = true; const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', render);

/* ===================== Interactions ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const h = (location.hash || '#accueil').slice(1);
  if (t.id === 'langBtn') { const m = $('#langMenu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) m.querySelector('[aria-current="true"]').focus(); return; }
  if (t.dataset.lang) { setLang(t.dataset.lang); toast(LANGS.find(l => l.c === t.dataset.lang).n); $('#langBtn').focus(); return; }
  if (t.hasAttribute('data-allcat')) { state.filters = { envies: [], dest: 'tous', duree: 'toutes', tri: 'populaires' }; }
  if (t.hasAttribute('data-req-again')) { if (h === 'hotels' && state.hotels) { state.hotels.pick = null; state.hotels.req = null; } if (h === 'devis') state.quote = null; else if (h.startsWith('activite-')) state.pick[h.slice(9)] = null; rerender(); return; }
  if (t.dataset.envie) { state.filters = { envies: [t.dataset.envie], dest: 'tous', duree: 'toutes', tri: 'populaires' }; location.hash = 'catalogue'; return; }
  if (t.dataset.fav) { e.preventDefault(); const on = toggleFav(t.dataset.fav); document.querySelectorAll(`[data-fav="${t.dataset.fav}"]`).forEach(b => { b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? tr('fav_rm') : tr('fav_add')); }); return; }
  if (t.dataset.day || t.dataset.time || t.dataset.calm) {
    const a = bySlug[h.slice(9)]; if (!a) return; const p = state.pick[a.slug] || (state.pick[a.slug] = { t0: Date.now() }); const st = state.avail[a.slug];
    if (t.dataset.calm) { const [y, m] = st.month.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(t.dataset.calm), 1)); st.month = d.toISOString().slice(0, 7); }
    if (t.dataset.day) { p.day = t.dataset.day; p.time = null; }
    if (t.dataset.time) p.time = t.dataset.time;
    const focusKey = t.dataset.day ? `[data-day="${t.dataset.day}"]` : t.dataset.time ? `[data-time="${t.dataset.time}"]` : `[data-calm="${t.dataset.calm}"]`;
    $('#avail').outerHTML = calendarHtml(a); syncTimes(a);
    const back = document.querySelector('#avail ' + focusKey); if (back && !back.disabled) back.focus();
    return;
  }
  if (t.hasAttribute('data-goreq')) { e.preventDefault(); const f = $('#reqForm'); if (f) { f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); setTimeout(() => { const n = $('#rq-name'); if (n) n.focus({ preventScroll: true }); }, 400); } return; }
  if (t.id === 'resetFilters') { state.filters = { envies: [], dest: 'tous', duree: 'toutes', tri: 'populaires' }; rerender(); return; }
});

document.addEventListener('click', e => { const m = $('#langMenu'); if (m && !m.hidden && !e.target.closest('.langsel')) { m.hidden = true; $('#langBtn').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { const m = $('#langMenu'); if (e.key === 'Escape' && m && !m.hidden) { m.hidden = true; $('#langBtn').setAttribute('aria-expanded', 'false'); $('#langBtn').focus(); } });
document.addEventListener('input', e => { if (e.target.closest('#reqForm, #quote, #htReq, #htSearch')) state.typing = true; });
document.addEventListener('change', e => {
  const s = state.hotels; if (!s) return;
  if (e.target.id === 'ht-kids') { const n = Number(e.target.value); s.dest = $('#ht-dest').value; s.din = $('#ht-in').value; s.dout = $('#ht-out').value; s.adults = Number($('#ht-ad').value); s.ages = Array.from({ length: n }, (_, i) => s.ages[i] != null ? s.ages[i] : 8); rerender(); const k = $('#ht-kids'); if (k) k.focus(); }
  if (e.target.dataset && e.target.dataset.htAge != null) s.ages[Number(e.target.dataset.htAge)] = Number(e.target.value);
});
document.addEventListener('click', e => {
  const s = state.hotels; if (!s) return;
  const b = e.target.closest('[data-ht-pick]');
  if (b) { const [hid, i] = b.dataset.htPick.split(':'); const h = s.res.list.find(x => String(x.id) === hid), o = h.options[Number(i)];
    s.pick = { hotel: h.name, room: o.room, board: o.board, total_cents: o.total_cents, nights: o.nights }; s.req = null; render(); const n = $('#hq-name'); if (n) n.focus(); }
  if (e.target.closest('[data-ht-back]')) { s.pick = null; s.req = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target; const f = state.filters;
  if (t.name === 'envie') { f.envies = [...document.querySelectorAll('input[name=envie]:checked')].map(x => x.value); rerender(); }
  else if (t.name === 'duree') { f.duree = t.value; rerender(); }
  else if (t.id === 'f-dest') { f.dest = t.value; rerender(); }
  else if (t.id === 'f-tri') { f.tri = t.value; rerender(); }
});

function setErr(input, errEl, msg) { if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false'); if (errEl) errEl.textContent = msg || ''; return !msg; }
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'reqForm') { submitBooking(f); return; }
  if (f.id === 'quote') { submitQuote(f); return; }
  if (f.id === 'htReq') { submitHotelRequest(f); return; }
  if (f.id === 'htSearch') {
    const s = state.hotels; s.dest = $('#ht-dest').value; s.din = $('#ht-in').value; s.dout = $('#ht-out').value; s.adults = Number($('#ht-ad').value);
    searchHotels(); return;
  }
  if (f.id === 'heroSearch') {
    const env = $('#hs-envie').value;
    state.filters = { envies: env ? [env] : [], dest: $('#hs-dest').value, duree: 'toutes', tri: 'populaires' };
    location.hash = 'catalogue';
  }
});

applyPalette('rosso'); setLogo('arche');
try { const sl = localStorage.getItem('tc-lang'); if (sl && UI[sl]) LANG = sl; } catch (e) {}
applyChrome(); syncFromDb();
render();
